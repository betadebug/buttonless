<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Modern Volume Icon</title>
  <desc id="desc">A modern blue gradient circular app icon with a crisp white speaker and two sound waves.</desc>
  <defs>
    <linearGradient id="blue" x1="170" y1="115" x2="840" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18C8F7"/>
      <stop offset="0.52" stop-color="#0787F9"/>
      <stop offset="1" stop-color="#1557F5"/>
    </linearGradient>
    <linearGradient id="white" x1="360" y1="320" x2="650" y2="710" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 220) rotate(52) scale(620)">
      <stop stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="170" y="180" width="690" height="700" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#063C9A" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Clean, transparent canvas with a single confident silhouette -->
  <circle cx="512" cy="512" r="448" fill="url(#blue)"/>
  <circle cx="512" cy="512" r="448" fill="url(#shine)"/>
  <circle cx="512" cy="512" r="447" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- Speaker -->
    <path d="M318 421
             H397
             L480 347
             C509 321 545 338 545 372
             V652
             C545 686 509 703 480 677
             L397 603
             H318
             C289 603 270 584 270 555
             V469
             C270 440 289 421 318 421Z"
          fill="url(#white)"/>

    <!-- Sound waves: consistent stroke weight and smooth geometry -->
    <path d="M625 424
             C661 467 661 557 625 600"
          stroke="url(#white)" stroke-width="42" stroke-linecap="round"/>

    <path d="M716 365
             C769 443 769 581 716 659"
          stroke="url(#white)" stroke-width="42" stroke-linecap="round"/>
  </g>
</svg>
